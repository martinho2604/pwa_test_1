<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline First Demo App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js (IndexedDB 封裝庫) -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DemoApp" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center p-4">

  <!-- App Header -->
  <header class="w-full max-w-md bg-white rounded-2xl shadow-sm p-4 mb-4 flex justify-between items-center border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900">離線記事本 Demo</h1>
    <!-- 網路連線狀態標籤 -->
    <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 transition-all">
      連線中
    </span>
  </header>

  <!-- 主要內容區 -->
  <main class="w-full max-w-md space-y-4">
    <!-- 輸入表單 -->
    <form id="note-form" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div>
        <input 
          type="text" 
          id="note-input" 
          placeholder="輸入內容（離線亦可新增）..." 
          class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
      </div>
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-xl shadow transition-colors"
      >
        新增事項
      </button>
    </form>

    <!-- 記事清單 -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700">記錄列表</h2>
        <span id="sync-info" class="text-xs text-slate-400">已同步至本地</span>
      </div>
      <ul id="note-list" class="space-y-2">
        <!-- 列表由 JS 動態生成 -->
      </ul>
    </div>
  </main>

  <script>
    // -------------------------------------------------------------
    // 1. 初始化 IndexedDB (Dexie.js)
    // -------------------------------------------------------------
    const db = new Dexie('DemoOfflineApp');
    db.version(1).stores({
      notes: '++id, content, synced, createdAt'
    });

    // DOM 元素引用
    const form = document.getElementById('note-form');
    const input = document.getElementById('note-input');
    const list = document.getElementById('note-list');
    const statusBadge = document.getElementById('status-badge');

    // -------------------------------------------------------------
    // 2. 渲染清單
    // -------------------------------------------------------------
    async function renderNotes() {
      const notes = await db.notes.orderBy('id').reverse().toArray();
      list.innerHTML = '';

      if (notes.length === 0) {
        list.innerHTML = `<li class="text-slate-400 text-center py-4 text-sm">目前沒有任何記錄</li>`;
        return;
      }

      notes.forEach(note => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100';
        
        const syncBadge = note.synced 
          ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">已同步雲端</span>`
          : `<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">待同步 (離線)</span>`;

        li.innerHTML = `
          <div class="flex flex-col">
            <span class="font-medium text-slate-800">${escapeHtml(note.content)}</span>
            <span class="text-[10px] text-slate-400">${new Date(note.createdAt).toLocaleTimeString()}</span>
          </div>
          <div class="flex items-center gap-2">
            ${syncBadge}
            <button onclick="deleteNote(${note.id})" class="text-slate-400 hover:text-red-500 text-sm px-1">✕</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    // -------------------------------------------------------------
    // 3. 新增與刪除資料（先寫入本地）
    // -------------------------------------------------------------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content) return;

      const isOnline = navigator.onLine;

      // 寫入本地資料庫
      await db.notes.add({
        content,
        synced: isOnline ? 1 : 0, // 若在線直接標記已同步，離線則標記 0
        createdAt: new Date().toISOString()
      });

      input.value = '';
      await renderNotes();

      // 若連線中，模擬觸發雲端同步 API
      if (isOnline) {
        mockCloudSync();
      }
    });

    async function deleteNote(id) {
      await db.notes.delete(id);
      await renderNotes();
    }

    // XSS 防護
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // -------------------------------------------------------------
    // 4. 網路狀態偵測與模擬同步邏輯
    // -------------------------------------------------------------
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusBadge.textContent = '連線中';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800';
        syncUnsyncedNotes(); // 連線時自動觸發同步
      } else {
        statusBadge.textContent = '離線模式';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800';
      }
    }

    // 模擬將離線期間新增的資料上傳至伺服器
    async function syncUnsyncedNotes() {
      const unsynced = await db.notes.where('synced').equals(0).toArray();
      if (unsynced.length === 0) return;

      console.log(`偵測到 ${unsynced.length} 筆待同步資料，開始背景同步...`);

      // 模擬 API 延遲
      setTimeout(async () => {
        for (let item of unsynced) {
          await db.notes.update(item.id, { synced: 1 });
        }
        console.log('同步完成！');
        await renderNotes();
      }, 1000);
    }

    function mockCloudSync() {
      console.log('資料已實時傳送至雲端伺服器');
    }

    // 監聽連線狀態改變
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // 頁面初始化
    updateOnlineStatus();
    renderNotes();
  </script>
</body>
</html>
