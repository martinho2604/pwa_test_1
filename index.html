<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ed" />
  <title>日日記帳</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日日記帳" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    :root { --ink: #1f2a25; --muted: #718078; --paper: #fffdf9; --cream: #f6f3ed; --line: #e8e4db; --green: #236b53; --orange: #e27d47; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: 'DM Sans', 'Noto Sans TC', sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { max-width: 1180px; margin: 0 auto; padding: 38px 24px 64px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .eyebrow { color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1, h2, p { margin: 0; }
    h1 { margin-top: 6px; font-family: 'Noto Sans TC', sans-serif; font-size: clamp(30px, 5vw, 48px); letter-spacing: -1px; line-height: 1.15; }
    .subtitle { color: var(--muted); margin-top: 9px; font-size: 15px; }
    .saved-state { color: var(--green); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .dashboard { display: grid; grid-template-columns: minmax(300px, .82fr) minmax(0, 1.45fr); gap: 22px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px rgba(48, 57, 48, .055); }
    .form-panel { min-width: 0; padding: 25px; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 21px; }
    h2 { font-family: 'Noto Sans TC', sans-serif; font-size: 19px; font-weight: 900; }
    .field { display: grid; min-width: 0; gap: 7px; margin-bottom: 15px; }
    label { color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select { width: 100%; color: var(--ink); background: #faf8f3; border: 1px solid var(--line); border-radius: 10px; outline: none; padding: 12px 13px; transition: border-color .2s, box-shadow .2s; }
    input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(35, 107, 83, .12); }
    input[type='date'] { display: block; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; }
    .date-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; min-width: 0; }
    .today-button { color: var(--green); background: #e1eee6; border: 0; border-radius: 10px; padding: 0 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .today-button:hover { background: #cfe3d7; }
    .amount-wrap { position: relative; }
    .amount-wrap span { position: absolute; left: 13px; top: 12px; color: var(--muted); font-weight: 700; }
    .amount-wrap input { padding-left: 32px; font-size: 19px; font-weight: 700; }
    .submit-button { width: 100%; color: #fff; background: var(--green); border: 0; border-radius: 10px; margin-top: 4px; padding: 13px; font-weight: 700; transition: transform .2s, background .2s; }
    .submit-button:hover { background: #174f3d; transform: translateY(-1px); }
    .overview { display: grid; gap: 22px; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .summary-item { padding: 18px; background: #ede8dc; border-radius: 14px; }
    .summary-item:nth-child(2) { background: #e1eee6; }
    .summary-item:nth-child(3) { background: #f6e3d4; }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-value { display: block; margin-top: 6px; font-size: 24px; font-weight: 700; }
    .chart-panel { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 30px; padding: 25px; }
    .chart { width: 174px; height: 174px; position: relative; display: grid; place-items: center; border-radius: 50%; background: #e9e4d9; }
    .chart::after { content: ''; position: absolute; width: 94px; height: 94px; background: var(--paper); border-radius: 50%; }
    .chart-center { z-index: 1; text-align: center; }
    .chart-center strong { display: block; font-size: 21px; }
    .chart-center span { color: var(--muted); font-size: 11px; }
    .chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .period-controls { display: flex; align-items: center; gap: 7px; margin-top: 14px; }
    .period-toggle { display: flex; padding: 3px; background: #ede8dc; border-radius: 8px; }
    .period-button, .period-arrow { color: var(--muted); background: transparent; border: 0; border-radius: 6px; font-size: 12px; font-weight: 700; padding: 6px 9px; }
    .period-button.is-active { color: #fff; background: var(--green); }
    .period-arrow { width: 27px; height: 27px; padding: 0; font-size: 18px; line-height: 1; }
    .period-arrow:hover, .period-button:not(.is-active):hover { color: var(--green); background: #e1eee6; }
    .period-label { min-width: 74px; color: var(--muted); font-size: 12px; text-align: center; }
    .legend { display: grid; gap: 12px; margin-top: 17px; }
    .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; }
    .legend-name { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .legend-amount { color: var(--muted); font-weight: 700; }
    .empty-chart { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .list-panel { padding: 25px; }
    .clear-button { color: var(--muted); background: transparent; border: 0; font-size: 12px; }
    .clear-button:hover { color: #c2553c; }
    .expense-list { display: grid; gap: 8px; }
    .expense-row { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .expense-row:last-child { border-bottom: 0; }
    .expense-category { color: var(--muted); font-size: 12px; }
    .expense-note { font-size: 14px; font-weight: 700; }
    .expense-date { color: var(--muted); font-size: 12px; }
    .expense-amount { font-size: 14px; font-weight: 700; }
    .delete-button { color: #a4ada7; background: none; border: 0; font-size: 18px; line-height: 1; padding: 4px; }
    .delete-button:hover { color: #c2553c; }
    .empty-list { color: var(--muted); padding: 20px 0 5px; text-align: center; font-size: 13px; }
    @media (max-width: 760px) { .app-shell { padding: 26px 16px 44px; } .topbar { align-items: flex-start; margin-bottom: 24px; } .saved-state { padding-top: 6px; } .dashboard { grid-template-columns: 1fr; } .chart-panel { grid-template-columns: 145px 1fr; gap: 20px; padding: 20px; } .chart { width: 140px; height: 140px; } .chart::after { width: 76px; height: 76px; } .summary-item { padding: 14px 12px; } .summary-value { font-size: 18px; } .expense-row { grid-template-columns: 9px 1fr auto; } .expense-date { grid-column: 2; grid-row: 2; } .expense-amount { grid-column: 3; grid-row: 1 / span 2; } .delete-button { display: none; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">Personal finance · 2026</div><h1>日日記帳</h1><p class="subtitle">把每一筆日常，記成更清楚的選擇。</p></div>
      <span class="saved-state">● 已儲存到本機</span>
    </header>
    <main class="dashboard">
      <section class="panel form-panel">
        <div class="panel-heading"><h2>新增支出</h2><span class="eyebrow">Add expense</span></div>
        <form id="expense-form">
          <div class="field"><label for="expense-amount">金額</label><div class="amount-wrap"><span>$</span><input id="expense-amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div></div>
          <div class="field"><label for="expense-category">分類</label><select id="expense-category" required><option value="food">飲食</option><option value="transport">交通</option><option value="shopping">購物</option><option value="bills">住屋／帳單</option><option value="fun">娛樂</option><option value="other">其他</option></select></div>
          <div class="field"><label for="expense-note">備註</label><input id="expense-note" type="text" maxlength="60" placeholder="例如：午餐、月票⋯" /></div>
          <div class="field"><label for="expense-date">日期</label><div class="date-actions"><input id="expense-date" type="date" required /><button id="today-button" class="today-button" type="button">今日</button></div></div>
          <button class="submit-button" type="submit">＋ 記低呢筆支出</button>
        </form>
      </section>
      <section class="overview">
        <div class="summary"><div class="summary-item"><span class="summary-label">本月支出</span><strong class="summary-value" id="month-total">$0.00</strong></div><div class="summary-item"><span class="summary-label">今日支出</span><strong class="summary-value" id="today-total">$0.00</strong></div><div class="summary-item"><span class="summary-label">記錄筆數</span><strong class="summary-value" id="expense-count">0 筆</strong></div></div>
        <section class="panel chart-panel"><div id="category-chart" class="chart"><div class="chart-center"><strong id="chart-total">$0</strong><span>總支出</span></div></div><div><div class="chart-heading"><h2>支出分布</h2><span id="period-label" class="period-label"></span></div><div class="period-controls"><button class="period-arrow" id="previous-period" type="button" aria-label="上一個期間">‹</button><div class="period-toggle"><button class="period-button is-active" data-period="month" type="button">月</button><button class="period-button" data-period="year" type="button">年</button></div><button class="period-arrow" id="next-period" type="button" aria-label="下一個期間">›</button></div><div id="category-legend" class="legend"></div></div></section>
        <section class="panel list-panel"><div class="panel-heading"><h2>最近記錄</h2><button id="clear-expenses" class="clear-button" type="button">清除全部</button></div><div id="expense-list" class="expense-list"></div></section>
      </section>
    </main>
  </div>
  <script type="module" src="./dist/app.js"></script>
</body>
</html>
